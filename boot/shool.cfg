# ShoolLoader🔱 configuration
#
# Global settings first, then the entries the menu offers. An entry starts
# with "entry = <name>"; what follows belongs to it (see shoolloader/src/loader.h):
#   title = ...            shown in the menu
#   like = <entry>         copy an earlier entry's kernel and modules
#   kernel = <path>        the kernel to awaken
#   module = <path>        a program to load next to it (max 32)
#   mode = normal | safe | recovery
#   diagnostic = yes       diagnostic boot (holding D does the same)
#   fallback = <entry>     tried when this entry fails to load
#
# Anything else (or a bad value) stops the boot with the line number. This
# file is in the signed list (shool.sum): edit it here and rebuild.

timeout = 2
default = normal
resolution = 1280x800

entry = normal
title = Bhairav OS
kernel = /boot/rudracore.elf
module = /boot/init.elf
module = /boot/acpi.elf
module = /boot/fonts.bin
module = /boot/catalog.bin
module = /boot/trust.bin
module = /boot/roots.bin
module = /boot/ps2.elf
module = /boot/ahci.elf
module = /boot/fs.elf
module = /boot/e1000.elf
module = /boot/rtl8139.elf
module = /boot/net.elf
module = /boot/kamalshell.elf
module = /boot/about.elf
module = /boot/browser.elf
module = /boot/files.elf
module = /boot/terminal.elf
module = /boot/store.elf
module = /boot/notes.elf
module = /boot/monitor.elf
module = /boot/ipc-test.elf
module = /boot/protect-test.elf
module = /boot/oom-test.elf
module = /boot/harden-test.elf
module = /boot/fpu-test.elf
module = /boot/fs-test.elf
module = /boot/net-test.elf
module = /boot/tls-test.elf
fallback = previous

# Only offered when the build shipped one (make PREVIOUS_KERNEL=...).
entry = previous
title = Bhairav OS, previous kernel
like = normal
kernel = /boot/rudracore-previous.elf
fallback = safe

entry = safe
title = Bhairav OS: safe mode
like = normal
mode = safe
fallback = recovery

entry = recovery
title = Bhairav OS: recovery
like = normal
mode = recovery

entry = diagnostic
title = Bhairav OS: diagnostic boot
like = normal
diagnostic = yes
